{# <--! archivobanzai/backend/templates/registro.html --> #}
{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
<h2>Pedir cuenta</h2>
<p class="muted">Un administrador activará tu cuenta para poder subir material.</p>
<form method="post">
<label>Usuario</label><input name="username" required>
<label>Email</label><input name="email" type="email" required>
<label>Contraseña</label><input name="password" type="password" required>
<p style="margin-top:14px"><button class="btn gold">Crear cuenta</button></p>
</form>
</div>
{% endblock %}
