<!-- archivobanzai/backend/templates/base.html -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel · Archivo Ban Zai</title>
    <link rel="stylesheet" href="/panel.css">
  </head>
  <body>
    <header>
      <h1>
        <a href="/" title="Volver al Inicio">BAN<span>ZAI</span> · PANEL</a>
      </h1>
      <div class="user">
        <a href="/">↗ Ver sitio público</a>
        {% if session.get('user_id') %}
          · {{ session.get('username') }} ({{ session.get('role') }}) ·
          <a href="{{ url_for('auth.logout') }}">Salir</a>
        {% endif %}
      </div>
    </header>
    {% for m in get_flashed_messages() %}
      <div class="flash">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </body>
</html>
